spring:
  application:
    name: sky-take-server
  datasource:
    url: jdbc:mysql://47.109.80.234:3306/sky_take_out?serverTimezone=Asia/Shanghai&useSSL=false&useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: "040412"

  data:
    redis:
      # Redis数据库索引(默认为0)
      database: 0
      # Redis服务器地址
      host: 47.109.80.234
      # Redis服务器连接端口
      port: 6379
      # Redis服务器连接密码(默认为空)
      password: "040412"
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池最大连接数
          max-active: 200
          # 连接池最大阻塞等待时间(使用负值表示没有限制)
          max-wait: -1
          # 连接池中的最大空闲连接
          max-idle: 10
          # 连接池中的最小空闲连接
          min-idle: 0

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: xyz.nullicn.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    xyz:
      nullicn:
        skytakeserver:
          mapper: debug
          service: info
          admin: info

