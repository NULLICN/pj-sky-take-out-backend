#  servlet:
#    context-path: /api
spring:
  profiles:
    active: dev
  application:
    name: sky-take-server
  datasource:
    url: jdbc:mysql://${SKY_DATASOURCE_HOST}:${SKY_DATASOURCE_PORT}/${SKY_DATASOURCE_DATABASE}?serverTimezone=Asia/Shanghai&useSSL=false&useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SKY_DATASOURCE_USERNAME}
    password: ${SKY_DATASOURCE_PASSWORD}

  cache:
    type: redis
    redis:
      time-to-live: 120s
      key-prefix: "sky:"
      cache-null-values: false

  data:
    redis:
      # Redis数据库索引(默认为0)
      database: ${SKY_REDIS_DATABASE:0}
      # Redis服务器地址
      host: ${SKY_REDIS_HOST}
      # Redis服务器连接端口
      port: ${SKY_REDIS_PORT:6379}
      # Redis服务器连接密码(默认为空)
      password: ${SKY_REDIS_PASSWORD}
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池最大连接数
          max-active: 200
          # 连接池最大阻塞等待时间(使用负值表示没有限制)
          max-wait: -1
          # 连接池中的最大空闲连接
          max-idle: 10
          # 连接池中的最小空闲连接
          min-idle: 0

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: xyz.nullicn.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    xyz:
      nullicn:
        skytakeserver:
          mapper: debug
          service: info
          admin: info

springdoc:
  info:
    title: 苍穹外卖项目接口文档
    version: "2.0"
    description: 苍穹外卖项目接口文档
  group-configs:
    - group: admin
      packages-to-scan: xyz.nullicn.skytakeserver.controller.admin

sky:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: ${SKY_JWT_ADMIN_SECRET_KEY}
    # 设置jwt过期时间
    admin-ttl: 0  # 0表示永久有效
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    user-secret-key: ${SKY_JWT_USER_SECRET_KEY}
    user-token-name: authentication
    user-ttl: 7200000  # 2小时，单位毫秒

  alioss:
    access-key-id: ${SKY_ALIOSS_ACCESS_KEY_ID}
    access-key-secret: ${SKY_ALIOSS_ACCESS_KEY_SECRET}
    bucket-name: ${SKY_ALIOSS_BUCKET_NAME}
    endpoint: ${SKY_ALIOSS_ENDPOINT}
  wechat:
    appid: ${SKY_WECHAT_APPID}
    secret: ${SKY_WECHAT_SECRET}