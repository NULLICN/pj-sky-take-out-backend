name: Deploy to Server

on:
  push:
    branches: [ main ]  # 推送到主分支时触发
  # 也可以手动触发
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 JDK（开启 Maven 依赖缓存）
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Maven 编译打包
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4. 在 CI 环境构建 Docker 镜像并导出
      - name: Build and save Docker image
        run: |
          docker build -t sky-take-out-backend:latest \
            -f - . << 'DOCKERFILE'
          FROM eclipse-temurin:21-jre
          WORKDIR /app
          COPY sky-take-server/target/*.jar app.jar
          EXPOSE 8080
          CMD ["java", "-jar", "app.jar"]
          DOCKERFILE

          mkdir -p dist
          docker save -o dist/sky-take-out-backend.tar sky-take-out-backend:latest
          sudo chmod 644 dist/sky-take-out-backend.tar
          echo "Image size: $(du -sh dist/sky-take-out-backend.tar)"

      # 5. 上传镜像文件到服务器
      - name: Upload image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/sky-take-out-backend.tar"
          target: "/var/www/sky-take-out/"
          strip_components: 1

      # 6. Docker 容器部署
      - name: Deploy with Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 清理已有容器
            docker stop sky-take-out-backend 2>/dev/null || true
            docker rm sky-take-out-backend 2>/dev/null || true

            # 加载镜像
            docker load -i /var/www/sky-take-out/sky-take-out-backend.tar

            # 启动容器
            docker run -d \
              --name sky-take-out-backend \
              -p 8080:8080 \
              --restart unless-stopped \
              sky-take-out-backend:latest

            # 清理旧镜像（保留当前使用的）
            docker image prune -f

            echo "Deployment completed at $(date)"
            docker ps --filter name=sky-take-out-backend
